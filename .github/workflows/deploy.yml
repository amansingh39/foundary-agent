# Deploys main to the App Service once the tests pass.
#
# Signs in to Azure with OpenID Connect: a user-assigned managed identity
# trusts this repository's main branch (federated credential
# repo:amansingh39/foundary-agent:ref:refs/heads/main) and holds Website
# Contributor on the web app only. No password or publish profile is stored
# in GitHub; the three IDs below are repository variables, not secrets.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: iga-test
  APP_NAME: authsec-agent-chat

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only what the app needs; App Service installs requirements.txt
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true). build.txt names the commit,
      # which /healthz reports.
      - name: Package
        run: |
          echo "$GITHUB_SHA" > build.txt
          zip -r app.zip app.py gunicorn.conf.py requirements.txt prompts_default.json build.txt static

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Returns once the package is built and in place. Not --track-status:
      # on the Free plan Azure's startup report can lag the app by many
      # minutes; the next step checks the app itself instead.
      - name: Deploy
        run: az webapp deploy -g "$RESOURCE_GROUP" -n "$APP_NAME" --src-path app.zip --type zip --track-status false

      - name: Check the new version answers
        run: |
          host=$(az webapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query defaultHostName -o tsv)
          for i in $(seq 1 40); do
            running=$(curl -fsS -m 20 "https://$host/healthz" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            if [ "$running" = "$GITHUB_SHA" ]; then echo "up: https://$host ($running)"; exit 0; fi
            echo "waiting: running ${running:-nothing yet}"
            sleep 15
          done
          echo "https://$host did not start $GITHUB_SHA within 10 minutes" >&2
          exit 1
